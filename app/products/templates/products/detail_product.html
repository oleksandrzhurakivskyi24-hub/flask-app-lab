{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <article class="card">
        <div class="card-body">
            <h2>{{ product.name }}</h2>

            <p>{{ product.content }}</p>

            <p>
                <strong>Ціна: {{ product.price }} $</strong>
            </p>

            <p>
                <strong>ID товару:</strong> {{ product.id }}
            </p>

            <a
                class="btn btn-secondary"
                href="{{ url_for('products.product_list') }}"
            >
                Назад до товарів
            </a>
        </div>
    </article>
</div>
{% endblock %}
