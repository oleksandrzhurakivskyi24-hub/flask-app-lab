{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row g-4">
        <aside class="col-md-3">
            <nav class="list-group" aria-label="Меню користувача">
                <a class="list-group-item list-group-item-action"
                   href="{{ url_for('home') }}">
                    Головна
                </a>

                <a class="list-group-item list-group-item-action"
                   href="{{ url_for('users.greetings', name='John', age=30) }}">
                    Привітання
                </a>

                <a class="list-group-item list-group-item-action"
                   href="{{ url_for('users.admin') }}">
                    Адміністратор
                </a>

                <a class="list-group-item list-group-item-action"
                   href="{{ url_for('products.product_list') }}">
                    Товари
                </a>
            </nav>
        </aside>

        <section class="col-md-9">
            <h2>Вітаємо, {{ name }}!</h2>

            {% if age %}
                <p>Вік: {{ age }}</p>
            {% else %}
                <p>Вік не вказано.</p>
            {% endif %}
        </section>
    </div>
</div>
{% endblock %}
